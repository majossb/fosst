# ============================================================================
# FOSST V.I.D.A. — Render Blueprint — UAT
# ============================================================================

databases:
  - name: fosst-db-uat
    databaseName: fosst_uat_db
    user: fosst_uat_user
    plan: starter
    region: oregon

services:

  # ==========================================================================
  # 1. BACKEND DJANGO
  # ==========================================================================
  - type: web
    name: fosst-backend-uat
    runtime: python
    region: oregon
    plan: starter

    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python manage.py collectstatic --noinput

    preDeployCommand: |
      cd backend
      python manage.py migrate

    startCommand: |
      cd backend
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120

    envVars:
      - key: ENVIRONMENT
        value: uat

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: fosst-db-uat
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fosst-redis-uat
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      # ----------------------------------------------------------------------
      # Seguridad / Frontend
      # ----------------------------------------------------------------------
      - key: ALLOWED_HOSTS
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # ----------------------------------------------------------------------
      # Email / SMTP
      # ----------------------------------------------------------------------
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend

      - key: EMAIL_HOST
        sync: false

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_USE_TLS
        value: "True"

      - key: EMAIL_USE_SSL
        value: "False"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        sync: false

      - key: SERVER_EMAIL
        sync: false

      # ----------------------------------------------------------------------
      # Storage S3 / Cloudflare R2
      # ----------------------------------------------------------------------
      - key: STORAGE_BACKEND
        sync: false

      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      - key: AWS_STORAGE_BUCKET_NAME
        sync: false

      - key: AWS_S3_REGION_NAME
        sync: false

      - key: AWS_S3_ENDPOINT_URL
        sync: false

      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false

      # ----------------------------------------------------------------------
      # IA
      # ----------------------------------------------------------------------
      - key: ANTHROPIC_API_KEY
        sync: false


  # ==========================================================================
  # 2. CELERY WORKER
  # ==========================================================================
  - type: worker
    name: fosst-worker-uat
    runtime: python
    region: oregon
    plan: starter

    buildCommand: |
      cd backend
      pip install -r requirements.txt

    startCommand: |
      cd backend
      celery -A config worker --loglevel=info --concurrency=2

    envVars:
      - key: ENVIRONMENT
        value: uat

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: fosst-db-uat
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fosst-redis-uat
          property: connectionString

      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: fosst-backend-uat
          envVarKey: DJANGO_SECRET_KEY

      - key: JWT_SECRET
        fromService:
          type: web
          name: fosst-backend-uat
          envVarKey: JWT_SECRET

      - key: FRONTEND_URL
        sync: false

      # ----------------------------------------------------------------------
      # Email
      # ----------------------------------------------------------------------
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend

      - key: EMAIL_HOST
        sync: false

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_USE_TLS
        value: "True"

      - key: EMAIL_USE_SSL
        value: "False"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        sync: false

      - key: SERVER_EMAIL
        sync: false

      # ----------------------------------------------------------------------
      # Storage
      # ----------------------------------------------------------------------
      - key: STORAGE_BACKEND
        sync: false

      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      - key: AWS_STORAGE_BUCKET_NAME
        sync: false

      - key: AWS_S3_REGION_NAME
        sync: false

      - key: AWS_S3_ENDPOINT_URL
        sync: false

      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false


  # ==========================================================================
  # 3. CELERY BEAT
  # ==========================================================================
  - type: worker
    name: fosst-beat-uat
    runtime: python
    region: oregon
    plan: starter

    buildCommand: |
      cd backend
      pip install -r requirements.txt

    startCommand: |
      cd backend
      celery -A config beat --loglevel=info

    envVars:
      - key: ENVIRONMENT
        value: uat

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: fosst-db-uat
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fosst-redis-uat
          property: connectionString

      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: fosst-backend-uat
          envVarKey: DJANGO_SECRET_KEY

      - key: JWT_SECRET
        fromService:
          type: web
          name: fosst-backend-uat
          envVarKey: JWT_SECRET

      - key: FRONTEND_URL
        sync: false

      # ----------------------------------------------------------------------
      # Email
      # ----------------------------------------------------------------------
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend

      - key: EMAIL_HOST
        sync: false

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_USE_TLS
        value: "True"

      - key: EMAIL_USE_SSL
        value: "False"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        sync: false

      - key: SERVER_EMAIL
        sync: false

      # ----------------------------------------------------------------------
      # Storage
      # ----------------------------------------------------------------------
      - key: STORAGE_BACKEND
        sync: false

      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      - key: AWS_STORAGE_BUCKET_NAME
        sync: false

      - key: AWS_S3_REGION_NAME
        sync: false

      - key: AWS_S3_ENDPOINT_URL
        sync: false

      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false


  # ==========================================================================
  # 4. REDIS / KEY VALUE
  # ==========================================================================
  - type: keyvalue
    name: fosst-redis-uat
    region: oregon
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # ==========================================================================
  # 5. FRONTEND REACT + VITE
  # ==========================================================================
  - type: web
    name: fosst-frontend-uat
    runtime: static

    buildCommand: |
      cd frontend
      npm ci
      npm run build

    staticPublishPath: frontend/dist

    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html